openapi: 3.0.0
info:
  title: envd
  version: 0.1.3
  description: API for managing files' content and controlling envd

tags:
  - name: files

# Operations marked `x-internal: true` are the orchestrator's control plane. The
# orchestrator reaches them over the host network, straight at the sandbox slot
# IP, so they are never a legitimate destination for traffic arriving through the
# public sandbox URL. The sandbox proxy generates its rejection list from this
# marker, so adding a control operation here is what closes it to the outside;
# see the orchestrator's `pkg/sandbox/envd` package.
paths:
  /health:
    get:
      summary: Check the health of the service
      responses:
        "204":
          description: The service is healthy

  /metrics:
    get:
      summary: Service stats
      security:
        - AccessTokenAuth: []
        - {}
      responses:
        "200":
          description: The resource usage metrics of the service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Metrics"

  /init:
    post:
      summary: Set initial vars, ensure the time and metadata is synced with the host
      x-internal: true
      security:
        - AccessTokenAuth: []
        - {}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                volumeMounts:
                  type: array
                  items:
                    $ref: "#/components/schemas/VolumeMount"
                hyperloopIP:
                  type: string
                  description: IP address of the hyperloop server to connect to
                lifecycleID:
                  type: string
                  description: Lifecycle ID of the sandbox
                envVars:
                  $ref: "#/components/schemas/EnvVars"
                accessToken:
                  type: string
                  description: Access token for secure access to envd service
                  x-go-type: SecureToken
                timestamp:
                  type: string
                  format: date-time
                  description: The current timestamp in RFC3339 format
                defaultUser:
                  type: string
                  description: The default user to use for operations
                defaultWorkdir:
                  type: string
                  description: The default working directory to use for operations
                caBundle:
                  type: string
                  description: PEM-encoded CA certificates to install into the system trust store (may contain multiple concatenated PEM blocks)

      responses:
        "204":
          description: Env vars set, the time and metadata is synced with the host

  /freeze:
    post:
      summary: Freeze user/pty cgroups before pause and wait for them to stop. Written directly by envd to avoid Process.Start / shell overhead under load.
      description: |
        Writing cgroup.freeze only requests a freeze; the kernel stops each task at its
        next signal-delivery point. This endpoint therefore polls cgroup.events until the
        cgroups read back frozen, and returns what it observed, so a caller can tell a
        freeze that took effect from one that was merely issued.

        cgroup.events reports STATE, not an acknowledgement of our write: a cgroup the
        guest froze itself reads frozen too. The counts below say what was observed, not
        what this call caused.

        Best-effort by design: a workload that will not quiesce within the budget is
        reported as unconfirmed rather than failing the call, cgroups that reject the write
        are counted in failed, and cgroups the guest removed while the sweep was working on
        them are counted in vanished. None of the three may block a pause, which is why all
        three are counts in the body rather than an error.

        Whether this endpoint waits is the caller's choice, expressed by supplying
        maxWaitMs: see that parameter.
      x-internal: true
      parameters:
        - name: mode
          in: query
          required: false
          description: |
            Which cgroups to freeze. "hierarchy" freezes the complement of envd's own
            ancestor chain, so cgroups the customer created anywhere in the tree are
            covered; "legacy" freezes only the user and pty cgroups envd itself creates.
            Omitted means legacy, which is what an orchestrator predating this parameter
            gets.

            The mode is chosen by the caller because the feature flag that selects it is
            evaluated there — envd has no access to it. FreezeResult echoes the mode back
            so the caller can confirm envd honoured the request rather than inferring it
            from the flag's value: an envd too old to know about modes reports legacy
            while the flag reads on.
          schema:
            type: string
            enum: [legacy, hierarchy]
        - name: maxCgroups
          in: query
          required: false
          description: |
            Bounds how many cgroups a hierarchy sweep may visit. A safety guard against a
            pathological or hostile hierarchy rather than a performance knob — the guest is
            the threat model. Omitted or non-positive means envd's own default. Ignored in
            legacy mode.
          schema:
            type: integer
        - name: maxWaitMs
          in: query
          required: false
          description: |
            How long to wait for the cgroups to read back frozen, in milliseconds. The
            caller owns this budget because it also owns the request timeout, and a wait
            longer than that timeout cannot be observed.

            Supplying it also selects the response: with it, the call waits and answers 200
            with a FreezeResult; omitted or non-positive, the call does not wait at all and
            answers 204, which is the contract callers older than this parameter expect.
          schema:
            type: integer
            format: int64
      security:
        - AccessTokenAuth: []
        - {}
      responses:
        "200":
          description: Freeze issued and the frozen state awaited (maxWaitMs was supplied); the body reports what was observed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreezeResult"
        "204":
          description: Freeze issued without waiting (maxWaitMs absent), for callers predating the structured result
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          description: Freeze lock is held by another operation

  /unfreeze:
    post:
      summary: Unfreeze user/pty cgroups. Intended ONLY for the orchestrator's pause-failure rollback path; the normal resume thaw happens via /init's deferred unfreeze, not here.
      x-internal: true
      security:
        - AccessTokenAuth: []
        - {}
      responses:
        "204":
          description: Cgroups unfrozen
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          description: Freeze lock is held by another operation

  /collapse:
    post:
      summary: Collapse envd's own anonymous heap into 2 MiB transparent hugepages before pause, so on resume envd touches fewer distinct guest-physical frames (each a cold fault). Best-effort.
      x-internal: true
      security:
        - AccessTokenAuth: []
        - {}
      responses:
        "200":
          description: Heap collapsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollapseResult"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /cpus:
    post:
      summary: Bring guest CPUs online or offline so exactly the requested number is online (CPU hot resize).
      description: |
        The VM of a CPU-hotplug template has more vCPUs than it runs with; the extra ones are
        present but offline. envd onlines the lowest-numbered present CPUs up to `online` and
        offlines the rest (highest first), skipping CPUs already in the wanted state. cpu0 is
        always online. Per-CPU failures do not abort the call; the result reports what is online
        afterwards and the errors. The host cgroup quota, not this call, enforces the count.
      x-internal: true
      security:
        - AccessTokenAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CPUsRequest"
      responses:
        "200":
          description: The CPUs online after the call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPUsResult"
        "400":
          description: The request is outside [1, present CPUs]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      summary: Report the guest's present and online CPUs.
      x-internal: true
      security:
        - AccessTokenAuth: []
        - {}
      responses:
        "200":
          description: The current CPU state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CPUsResult"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /fsfreeze:
    post:
      summary: Freeze the guest rootfs (FIFREEZE) before a filesystem-only pause so it is flushed to a consistent on-disk state, closing the sync->pause race. Idempotent. On a successful filesystem-only pause the VM is rebooted, so no thaw is needed; the orchestrator thaws only on the pause-failure path.
      x-internal: true
      security:
        - AccessTokenAuth: []
        - {}
      responses:
        "204":
          description: Rootfs frozen
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          description: Freeze lock is held by another operation

  /fsthaw:
    post:
      summary: Thaw the guest rootfs (FITHAW). Intended ONLY for the orchestrator's pause-failure rollback path, so a frozen filesystem cannot leave the live VM deadlocked. Idempotent.
      x-internal: true
      security:
        - AccessTokenAuth: []
        - {}
      responses:
        "204":
          description: Rootfs thawed
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          description: Freeze lock is held by another operation

  /fsfreeze-set:
    post:
      summary: Freeze the mount set {every block volume envd mounted (deepest path first), then /} before a checkpoint. The server derives the set from its own ledger; the caller only names the operation.
      description: |
        Freezes each mountpoint in order and records the result under the request's
        operation token. On a partial failure the mountpoints that had frozen are
        thawed again in reverse order, and the 500 body is the same FsFreezeSetResult
        with state=failed saying which ones froze and which one failed, so the caller
        never has to guess what is still frozen. Idempotent per token: a repeated POST
        with a token whose set is already frozen returns the recorded result.
      x-internal: true
      security:
        - AccessTokenAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FsFreezeSetRequest"
      responses:
        "200":
          description: The whole set is frozen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsFreezeSetResult"
        "400":
          $ref: "#/components/responses/InvalidPath"
        "500":
          description: The freeze did not complete; what had frozen was thawed again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsFreezeSetResult"
        "503":
          description: Freeze lock is held by another operation
    get:
      summary: Report the recorded outcome of a mount-set freeze, for a caller whose POST response was lost.
      x-internal: true
      parameters:
        - name: operation_token
          in: query
          required: true
          schema:
            type: string
      security:
        - AccessTokenAuth: []
        - {}
      responses:
        "200":
          description: The recorded result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsFreezeSetResult"
        "404":
          description: No freeze with this token is recorded (never ran, or evicted after many later operations)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /fsthaw-set:
    post:
      summary: Thaw the mount set a /fsfreeze-set froze, in reverse order (/ first). The orchestrator's rollback path; a successful checkpoint reboots or destroys the VM instead.
      description: |
        With a known token, thaws exactly the mountpoints that froze. With an unknown
        token (the freeze POST was lost before the server recorded it, or the record
        was evicted) it thaws the whole current mount set, which is safe because the
        kernel treats thawing an unfrozen filesystem as a no-op.
      x-internal: true
      security:
        - AccessTokenAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FsFreezeSetRequest"
      responses:
        "200":
          description: Thaw attempted on every mountpoint; thaw_errors lists the ones that failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsFreezeSetResult"
        "503":
          description: Freeze lock is held by another operation

  /volumes/resize:
    post:
      summary: Grow the ext4 filesystem of a mounted block volume to its device size (online resize2fs). Used after the host enlarged the backing image of a paused sandbox and re-attached it.
      x-internal: true
      security:
        - AccessTokenAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolumeResizeRequest"
      responses:
        "200":
          description: resize2fs completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolumeResizeResult"
        "400":
          $ref: "#/components/responses/InvalidPath"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          description: Freeze lock is held by another operation

  /envs:
    get:
      summary: Environment variables
      security:
        - AccessTokenAuth: []
        - {}
      responses:
        "200":
          description: Environment variables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvVars"

  /files:
    get:
      summary: Download a file
      tags: [files]
      security:
        - AccessTokenAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/FilePath"
        - $ref: "#/components/parameters/User"
        - $ref: "#/components/parameters/Signature"
        - $ref: "#/components/parameters/SignatureExpiration"
      responses:
        "200":
          $ref: "#/components/responses/DownloadSuccess"
        "400":
          $ref: "#/components/responses/InvalidPath"
        "401":
          $ref: "#/components/responses/InvalidUser"
        "404":
          $ref: "#/components/responses/FileNotFound"
        "406":
          $ref: "#/components/responses/NotAcceptable"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Upload a file and ensure the parent directories exist. If the file exists, it will be overwritten.
      description: |
        Any request header of the form `X-Metadata-<key>: <value>` is persisted
        as a user-defined extended attribute on the uploaded file. The
        `X-Metadata-` prefix is stripped and the remaining header name is
        lowercased to form the metadata key; the resulting map is returned on
        `EntryInfo` lookups (e.g. `Stat`, `ListDir`).

        Each upload replaces the file's metadata with the keys provided in
        that request: keys previously stored but absent from the new request
        are removed, and an upload that sends no `X-Metadata-*` header clears
        all existing metadata.

        Both keys and values must be printable US-ASCII (bytes `0x20`-`0x7E`)
        and are rejected with HTTP 400 otherwise. Each key is capped at 246
        bytes (the Linux VFS xattr-name limit minus the namespace prefix), and
        the combined size of all metadata on a file (keys plus values, with the
        namespace prefix counted per key) is capped at 4096 bytes to stay within
        the filesystem's per-inode xattr budget. Multiple files in a single
        multipart upload receive the same metadata. If the same
        `X-Metadata-<key>` header is sent more than once, only the first
        value is used.
      tags: [files]
      security:
        - AccessTokenAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/FilePath"
        - $ref: "#/components/parameters/User"
        - $ref: "#/components/parameters/Signature"
        - $ref: "#/components/parameters/SignatureExpiration"
      requestBody:
        $ref: "#/components/requestBodies/File"
      responses:
        "200":
          $ref: "#/components/responses/UploadSuccess"
        "400":
          $ref: "#/components/responses/InvalidPath"
        "401":
          $ref: "#/components/responses/InvalidUser"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "507":
          $ref: "#/components/responses/NotEnoughDiskSpace"

  /files/compose:
    post:
      summary: Compose multiple files into a single file using zero-copy concatenation. Source files are deleted after successful composition.
      tags: [files]
      security:
        - AccessTokenAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposeRequest"
      responses:
        "200":
          description: Files composed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryInfo"
        "400":
          $ref: "#/components/responses/InvalidPath"
        "401":
          $ref: "#/components/responses/InvalidUser"
        "404":
          $ref: "#/components/responses/FileNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "507":
          $ref: "#/components/responses/NotEnoughDiskSpace"

components:
  securitySchemes:
    AccessTokenAuth:
      type: apiKey
      in: header
      name: X-Access-Token

  parameters:
    FilePath:
      name: path
      in: query
      required: false
      description: Path to the file, URL encoded. Can be relative to the user's home directory (e.g. "file.txt" resolves to ~/file.txt).
      schema:
        type: string
    User:
      name: username
      in: query
      required: false
      description: User for setting file ownership and resolving relative paths. Defaults to the sandbox's default user.
      schema:
        type: string
    Signature:
      name: signature
      in: query
      required: false
      description: Signature used for file access permission verification.
      schema:
        type: string
    SignatureExpiration:
      name: signature_expiration
      in: query
      required: false
      description: Unix timestamp (seconds) after which the signature expires. Only used with the signature parameter.
      schema:
        type: integer
  requestBodies:
    File:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              file:
                type: string
                format: binary
        application/octet-stream:
          schema:
            type: string
            format: binary
            description: Raw file content. The 'path' query parameter is required when using this content type.

  responses:
    UploadSuccess:
      description: The file was uploaded successfully.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/EntryInfo"
          example:
            - path: "/home/user/hello.txt"
              name: "hello.txt"
              type: "file"

    DownloadSuccess:
      description: Entire file downloaded successfully.
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
            description: The raw file content
    NotAcceptable:
      description: Requested encoding is not supported
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "no acceptable encoding found, supported: [identity, gzip]"
            code: 406
    InvalidPath:
      description: Invalid path
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "path '/home/user/docs' is a directory"
            code: 400
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "error opening file '/home/user/file.txt': permission denied"
            code: 500
    FileNotFound:
      description: File not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "path '/home/user/missing.txt' does not exist"
            code: 404
    InvalidUser:
      description: Invalid user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "error looking up user 'nonexistent': user: unknown user nonexistent"
            code: 401
    NotEnoughDiskSpace:
      description: Not enough disk space
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "not enough disk space available"
            code: 507

  schemas:
    CPUsRequest:
      type: object
      required: [online]
      properties:
        online:
          type: integer
          format: int64
          minimum: 1
          description: How many CPUs should be online after the call
    CPUsResult:
      type: object
      required: [online, present, hotpluggable]
      properties:
        online:
          type: integer
          format: int64
          description: CPUs online after the call (/sys/devices/system/cpu/online)
        present:
          type: integer
          format: int64
          description: CPUs present (the VM's vCPU count)
        hotpluggable:
          type: boolean
          description: Whether every present CPU but cpu0 has an online control (CONFIG_HOTPLUG_CPU)
        changed:
          type: integer
          format: int64
          description: CPUs this call brought online or offline
        errors:
          type: array
          items:
            type: string
          description: One entry per CPU whose state could not be changed
    Error:
      required:
        - message
        - code
      properties:
        message:
          type: string
          description: Error message
        code:
          type: integer
          description: Error code
    EntryInfo:
      required:
        - path
        - name
        - type
      properties:
        path:
          type: string
          description: Path to the file
        name:
          type: string
          description: Name of the file
        type:
          type: string
          description: Type of the file
          enum:
            - file
        metadata:
          type: object
          description: User-defined metadata stored as extended attributes on the file.
          additionalProperties:
            type: string
    EnvVars:
      type: object
      description: Environment variables to set
      additionalProperties:
        type: string
    Metrics:
      type: object
      description: Resource usage metrics
      properties:
        ts:
          type: integer
          format: int64
          description: Unix timestamp in UTC for current sandbox time
        cpu_count:
          type: integer
          description: Number of CPU cores
        cpu_used_pct:
          type: number
          format: float
          description: CPU usage percentage
        mem_total:
          type: integer
          description: Total virtual memory in bytes
        mem_used:
          type: integer
          description: Used virtual memory in bytes
        mem_cache:
          type: integer
          description: Cached memory (page cache) in bytes
        mem_total_mib:
          type: integer
          description: Total virtual memory in MiB
        mem_used_mib:
          type: integer
          description: Used virtual memory in MiB
        disk_used:
          type: integer
          description: Used disk space in bytes
        disk_total:
          type: integer
          description: Total disk space in bytes
    FreezeResult:
      type: object
      description: Per-call statistics from a pre-pause workload freeze
      properties:
        mode:
          type: string
          enum: [legacy, hierarchy]
          description: Which sweep actually ran. Echoed back rather than inferred from the flag, so a caller can tell that envd honoured what it asked for
        visited:
          type: integer
          description: Cgroups the walk examined, whether or not it froze them. The input for sizing the bound; meaningless in legacy mode
        allowlisted:
          type: integer
          description: Cgroups skipped because the resume path depends on them (systemd, journald, envd's port forwarding). Reported because the allowlist is expected to grow, and a distro that routes journald differently changes this count
        truncated:
          type: boolean
          description: True when the walk stopped because it hit the bound rather than because it ran out of tree, so coverage is incomplete
        preFrozen:
          type: integer
          description: Cgroups the guest itself had already frozen before the sweep ran (docker pause writes cgroup.freeze). Not written to and deliberately left frozen by the resume thaw, so the guest's own suspension survives the snapshot
        requested:
          type: integer
          description: Cgroups this call wrote cgroup.freeze to
        frozen:
          type: integer
          description: Cgroups that read back "frozen 1" from cgroup.events within the budget; their tasks have stopped
        notFrozen:
          type: integer
          description: Cgroups still reading "frozen 0" when the budget expired; their tasks may still be running, so a snapshot taken now can capture a live workload
        failed:
          type: integer
          description: Cgroups that errored for a reason that is not simply being gone - the write was refused, or the state could not be read. A cgroup the hierarchy walk discovered that merely went away is counted vanished instead; one of envd's own static cgroups that goes away is counted here, by design
        vanished:
          type: integer
          description: Cgroups the hierarchy walk enumerated that the guest then removed before the sweep finished with them - envd's own static cgroups are excluded and report failed instead. A race rather than a failure, and a claim about the cgroup only - tasks migrated out of it before its removal can still be running. Like failed it spans both phases, so it does not reconcile against requested on its own - one removed during the settle poll was counted in requested, one removed before its write never was
        unobservable:
          type: integer
          description: Cgroups whose freeze state cannot be read because this guest has no cgroup manager; the write was accepted but nothing can be read back, so these are neither frozen nor notFrozen
        sweepMs:
          type: integer
          format: int64
          description: Time spent issuing the freeze writes, in milliseconds (scales with cgroup count)
        waitMs:
          type: integer
          format: int64
          description: Time spent polling cgroup.events, in milliseconds (scales with how deep in I/O the guest tasks were). Outcome neutral - the wait ends either because everything stopped or because the budget ran out
    CollapseResult:
      type: object
      description: Per-call statistics from a heap collapse
      properties:
        regions:
          type: integer
          description: Anonymous read-write regions scanned
        chunks:
          type: integer
          description: 2 MiB chunks attempted
        collapsed:
          type: integer
          description: Chunks whose base pages were actually migrated into a new hugepage (real work)
        alreadyHuge:
          type: integer
          description: Chunks MADV_COLLAPSE accepted but were already hugepages (no work)
        skipped:
          type: integer
          description: Chunks that could not be collapsed (empty or ineligible)
        elapsedMs:
          type: integer
          format: int64
          description: Wall-clock time spent collapsing, in milliseconds
    ComposeRequest:
      type: object
      required:
        - source_paths
        - destination
      properties:
        source_paths:
          type: array
          items:
            type: string
          description: Ordered list of source file paths to concatenate
        destination:
          type: string
          description: Destination file path for the composed file
        username:
          type: string
          description: User for setting ownership and resolving relative paths
    VolumeMount:
      type: object
      description: |
        One volume to mount inside the sandbox. The union is discriminated by
        `source_type`; it stays wire-compatible with the original NFS-only shape,
        so an orchestrator predating block volumes keeps sending
        `{nfs_target, path}` and is read as `source_type: nfs`.

        - `nfs`: `nfs_target` is required; `mount_options`, when present, replaces
          envd's built-in option set after whitelist validation (see the field).
        - `block`: `fs_uuid` is required; envd resolves the guest block device by
          filesystem UUID, checks `capacity_bytes` when supplied and mounts it as
          ext4 at `path`.
      additionalProperties: false
      properties:
        source_type:
          type: string
          enum: [nfs, block]
          description: Which kind of volume this is. Omitted means nfs.
        nfs_target:
          type: string
          description: Server target address (`host:/export`). NFS only; required when source_type is nfs or omitted.
        path:
          type: string
          description: Mount path inside the sandbox
        mount_options:
          type: array
          items:
            type: string
          description: |
            NFS only. Mount options (one `key` or `key=value` per entry) that replace
            envd's built-in option set. Every entry must pass envd's whitelist (sync,
            async, rsize, wsize, proto=tcp, mountproto=tcp, port, mountport, nfsvers=3,
            noacl, noac, ac, lookupcache, actimeo, acregmin, acregmax, acdirmin,
            acdirmax, retry, fg, hard, nolock, local_lock); an entry outside it fails
            the whole /init. `nolock` is forced when neither `nolock` nor `local_lock`
            is given, because the NFS proxy has no lock manager. Absent means envd's
            built-in options, exactly as before this field existed.
        fs_uuid:
          type: string
          description: Block only. Filesystem UUID the guest device is found by (`blkid -U`).
        device_id:
          type: string
          description: Block only. The host-side drive id of the attached device; informational, carried into logs.
        format_version:
          type: integer
          description: Block only. Version of the on-disk layout the host formatted the volume with.
        capacity_bytes:
          type: integer
          format: int64
          description: Block only. Expected device size. When supplied, a device smaller than this fails the mount.
      required:
        - path
    VolumeResizeRequest:
      type: object
      additionalProperties: false
      required:
        - path
      properties:
        path:
          type: string
          description: Mount path of a block volume envd mounted through /init. Only paths from envd's own ledger are accepted.
    VolumeResizeResult:
      type: object
      required:
        - path
        - device
      properties:
        path:
          type: string
          description: The mount path that was grown
        device:
          type: string
          description: The guest block device resize2fs ran against
        output:
          type: string
          description: resize2fs combined output, for the orchestrator's log
    FsFreezeSetRequest:
      type: object
      additionalProperties: false
      required:
        - operation_token
      properties:
        operation_token:
          type: string
          description: |
            Caller-chosen opaque token naming this freeze. A later GET /fsfreeze-set
            with the same token reports what happened when the HTTP response was
            lost, and POST /fsthaw-set with it thaws exactly the set that froze.
            Repeating a POST /fsfreeze-set with a token that already froze is a no-op
            that returns the recorded result.
    FsFreezeSetResult:
      type: object
      required:
        - operation_token
        - state
        - frozen
      properties:
        operation_token:
          type: string
        state:
          type: string
          enum: [frozen, thawed, failed]
          description: |
            frozen: every mountpoint in the set is frozen. thawed: the set has been
            thawed (by /fsthaw-set, or by the rollback after a partial failure).
            failed: the freeze did not complete; the mountpoints that had frozen were
            thawed again in reverse order before this was reported.
        mountpoints:
          type: array
          items:
            type: string
          description: The mount set the server derived for this operation, in freeze order (block volumes deepest path first, then /)
        frozen:
          type: array
          items:
            type: string
          description: Mountpoints that froze, in the order they froze. On state=failed this is what was rolled back.
        thawed:
          type: array
          items:
            type: string
          description: Mountpoints that have since been thawed, in the order they thawed
        failed_mountpoint:
          type: string
          description: On state=failed, the mountpoint whose freeze failed
        error:
          type: string
          description: On state=failed, the freeze error
        thaw_errors:
          type: array
          items:
            type: string
          description: Mountpoints whose thaw failed (the set may be partially frozen; the orchestrator must not resume the VM until this is empty)
