syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "https://github.com/e2b-dev/infra/orchestrator";

message SandboxConfig {
  // Data required for creating a new sandbox.
  string template_id = 1;
  string build_id = 2;

  string kernel_version = 3;
  string firecracker_version = 4;

  bool huge_pages = 5;

  string sandbox_id = 6;
  map<string, string> env_vars = 7;

  // Metadata about the sandbox.
  map<string, string> metadata = 8;
  optional string alias = 9;
  string envd_version = 10;

  int64 vcpu = 11;
  int64 ram_mb = 12;

  string team_id = 13;
  // Maximum length of the sandbox in Hours.
  int64 max_sandbox_length = 14;

  int64 total_disk_size_mb = 15;

  bool snapshot = 16;
  string base_template_id = 17;

  bool auto_pause = 18;

  optional string envd_access_token = 19;
  string execution_id = 20;

  // Whether the sandbox should have access to the internet.
  // This is optional only for backwards compatibility.
  // After migration, the optional keyword can be removed.
  optional bool allow_internet_access = 21;

  optional SandboxNetworkConfig network = 22;

  repeated SandboxVolumeMount volumeMounts = 23;

  // Auto-resume policy for paused sandboxes.
  optional SandboxAutoResumeConfig auto_resume = 24;

  // When true, a timeout auto-pause takes a filesystem-only snapshot (no
  // memory) instead of a full memory snapshot. Only meaningful when auto_pause
  // is set. Passed through so the policy survives an API re-sync from the
  // orchestrator's sandbox list (mirrors auto_pause); the orchestrator itself
  // does not act on it — the API evictor does.
  bool auto_pause_filesystem_only = 25;

  // Retention of sandbox events in days
  int64 events_ttl_days = 26;

  // Sandbox workload identity configuration requested at create time. Absent on
  // older serialized configs, which decode as no workload identity.
  optional SandboxIam iam = 27;

  // Guest memory requested for this start, in MiB, for a template built with
  // a virtio-mem hotplug device (maxMemoryMB): ram_mb stays the boot memory,
  // the difference is plugged after the VM runs. 0 = the snapshot's size (a
  // new sandbox: ram_mb; a resume: what was plugged at pause). Refused for a
  // template without the device unless it equals ram_mb, and never above the
  // template's maximum (the node reads both from the template metadata).
  int64 requested_memory_mb = 28;

  // vCPU count requested for this start, for a template built with CPU
  // hotplug (maxCpuCount): vcpu stays the template's count (the CPUs online in
  // its snapshot), the VM has maxCpuCount vCPUs, and the guest brings this
  // many online once envd is up; the host cgroup quota of the Firecracker
  // process is set to it before the VM runs. 0 = the snapshot's count (a new
  // sandbox: vcpu; a resume: the count granted at pause). Refused for a
  // template without CPU hotplug unless it equals vcpu.
  int64 requested_vcpu = 29;
}

// Sandbox workload identity configuration. A non-empty tokens map defines the
// sandbox workload identity, which the orchestrator derives from the existing
// trusted team_id, sandbox_id, execution_id and template_id fields. No
// credential is minted, signed, or delivered here.
message SandboxIam {
  // Named workload-token definitions, keyed by a caller-chosen token name.
  map<string, SandboxIamToken> tokens = 1;
}

// A named workload-token definition. file_path is intentionally omitted: only
// absent/null is accepted at admission, so file delivery is not represented.
message SandboxIamToken {
  string audience = 1;
  string token_type = 2;
}

message SandboxAutoResumeConfig {
  // Policy values are owned by the API layer today (e.g. "off", "any").
  string policy = 1;
  // Timeout requested on initial sandbox create (seconds).
  uint64 timeout_seconds = 2;
}

// SandboxVolumeMount is one shared (NFS) volume mount of a sandbox.
// Field numbers: 1-4 predate per-volume consistency profiles, 5 is
// consistency_profile.
// Workspace block volumes are not carried here: they are bound to the
// sandbox's workspace slots, not mounted over NFS. Allocate new fields from 6.
message SandboxVolumeMount {
  string id = 1;
  string path = 2;
  string type = 3;
  string name = 4;
  // consistency_profile selects the NFS mount options envd uses for a shared
  // volume: "strict" (no attribute or name caching) or "cto" (close-to-open).
  // Empty keeps envd's built-in options, which is what every sandbox created
  // before this field existed gets.
  string consistency_profile = 5;
  // backend is "nfs" or empty (requests from before the field existed). Block
  // volumes never travel here: they are bound per start through
  // SandboxCreateRequest.workspace_slots. A worker refuses any other backend
  // instead of treating the mount as NFS.
  string backend = 6;
  // 7-9 carried block mount bindings (incarnation_id, fs_uuid,
  // capacity_bytes) before SandboxWorkspaceSlot became the only block
  // transport; never released.
  reserved 7, 8, 9;
  reserved "incarnation_id", "fs_uuid", "capacity_bytes";
}

// SandboxWorkspaceSlot binds one workspace block slot of a block-v1 template
// to one incarnation (a writable image) of a workspace volume, for one start.
// Carried by SandboxCreateRequest because the binding is per execution: every
// create, resume or fork gets the incarnation the control plane cloned for it.
// The volume belongs to the sandbox's team (SandboxConfig.team_id).
//
// fs_uuid and capacity_bytes are the control plane's record of the
// incarnation; when set, the orchestrator refuses a start whose image on disk
// differs. resize_to_bytes > 0 grows the volume before the guest runs (never
// shrinks): online on a memory restore, offline on a cold boot.
message SandboxWorkspaceSlot {
  uint32 slot = 1;
  string volume_id = 2;
  string incarnation_id = 3;
  string mount_path = 4;
  string fs_uuid = 5;
  uint64 capacity_bytes = 6;
  uint64 resize_to_bytes = 7;
}

// SandboxWorkspaceRevision is one workspace revision a pause or checkpoint
// sealed, after CreateSnapshot and before any resume, for the control plane to
// record against the snapshot (snapshot_volume_refs). operation_id is the
// orchestrator's blockvol operation, derived from the build id, so a replayed
// pause of the same build reports the same revision.
message SandboxWorkspaceRevision {
  uint32 slot = 1;
  string volume_id = 2;
  string source_incarnation_id = 3;
  string revision_id = 4;
  string operation_id = 5;
  string subvolume_uuid = 6;
  string fs_uuid = 7;
  uint64 size_bytes = 8;
  // "paired-memory" (memory pause/checkpoint) or "filesystem-quiesced"
  // (filesystem-only pause with the whole mount set frozen).
  string consistency = 9;
}

message SandboxNetworkConfig {
  optional SandboxNetworkEgressConfig egress = 1;
  optional SandboxNetworkIngressConfig ingress = 2;
}

message SandboxNetworkTransform {
  map<string, string> headers = 1;
}

message SandboxNetworkRule {
  optional SandboxNetworkTransform transform = 1;
}

message SandboxNetworkDomainRules {
  repeated SandboxNetworkRule rules = 1;
}

message SandboxNetworkEgressConfig {
  repeated string allowed_cidrs = 1;
  repeated string denied_cidrs = 2;
  repeated string allowed_domains = 3;
  map<string, SandboxNetworkDomainRules> rules = 4;

  // BYOP SOCKS5 egress proxy.
  string egress_proxy_address = 5;
  string egress_proxy_username = 6;
  string egress_proxy_password = 7;
}

message SandboxNetworkIngressConfig {
  optional string traffic_access_token = 1;
  optional string mask_request_host = 2;
  repeated uint32 https_ports = 3;
}

message SandboxCreateRequest {
  SandboxConfig sandbox = 1;

  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;

  // When true, resume by cold-booting from the snapshot's rootfs even when it
  // includes a memory snapshot. The request can only widen toward the no-memory
  // path — it can never force a memory restore of a snapshot that has none.
  // Absent = the snapshot's own metadata alone selects the boot path, so
  // existing callers are unaffected. Request-scoped: nothing durable records it.
  optional bool filesystem_boot = 4;

  // Fields 20+ belong to the workspace checkpoint track.
  // Workspace block slot bindings for this start; empty for a sandbox without
  // workspace volumes. Requires a block-v1 template.
  repeated SandboxWorkspaceSlot workspace_slots = 20;
}

message SandboxCreateResponse {
  string client_id = 1;
  SchedulingMetadata scheduling_metadata = 2;

  // Echoes whether the sandbox cold-booted from its rootfs (vs a memory
  // restore). Absent from orchestrators that predate filesystem_boot, so a
  // caller that demanded a filesystem boot can detect an unhonored demand
  // instead of trusting deploy ordering.
  bool filesystem_boot_applied = 3;

  // The Firecracker version the sandbox actually RUNS: the request's
  // declared version resolved through the firecracker-versions flag at
  // start, frozen for the sandbox's lifetime. Callers gating features on the
  // FC version must read this rather than re-deriving it — a re-resolution
  // can disagree with the frozen value whenever the flag changes or the
  // evaluation contexts differ. Empty from orchestrators that predate the
  // field.
  string resolved_firecracker_version = 4;

  // Guest memory the sandbox runs with after the start, in MiB: boot memory
  // plus what the guest had plugged when the start returned. Equals ram_mb
  // for a template without a hotplug device. Below requested_memory_mb when
  // the guest did not finish plugging within the node's timeout (accounting
  // then uses the request; the guest keeps plugging on its own).
  int64 memory_mb = 5;

  // vCPU count the sandbox runs with after the start: its cgroup quota
  // (equal to vcpu for a template without CPU hotplug). online_vcpu is how
  // many the guest had online when the start returned.
  int64 vcpu_count = 6;
  int64 online_vcpu = 7;
}

// Resizes the guest memory of a running sandbox of a hotplug template.
message SandboxResizeMemoryRequest {
  string sandbox_id = 1;
  // Target guest memory in MiB, within [ram_mb, maxMemoryMB] of the template.
  int64 requested_memory_mb = 2;
}

message SandboxResizeMemoryResponse {
  // The request as recorded on the node (block-aligned).
  int64 requested_memory_mb = 1;
  // Boot memory plus the hotplug memory plugged when the call returned.
  int64 memory_mb = 2;
  // The template's maximum.
  int64 max_memory_mb = 3;
  // Whether memory_mb reached requested_memory_mb before the node's timeout.
  // A shrink stalls while the guest pins the memory being unplugged; the
  // guest finishes on its own once it is freed, and accounting uses
  // max(requested, plugged) meanwhile.
  bool complete = 4;
}

// Changes the vCPU count of a running sandbox of a CPU-hotplug template.
message SandboxResizeCpuRequest {
  string sandbox_id = 1;
  // Target vCPU count, within [vcpu, maxCpuCount] of the template.
  int64 requested_vcpu = 2;
}

message SandboxResizeCpuResponse {
  // The count granted: the host cgroup quota, applied before the call
  // returned (it is what enforces the count).
  int64 vcpu_count = 1;
  // CPUs online in the guest when the call returned.
  int64 online_vcpu = 2;
  // The template's maximum.
  int64 max_vcpu = 3;
  // Whether online_vcpu == vcpu_count. Onlining takes ~60 ms per CPU and has
  // not failed in testing; an incomplete result is reported, not retried.
  bool complete = 4;
}

message SandboxUpdateRequest {
  string sandbox_id = 1;

  // All fields are optional — only set fields are applied.
  optional google.protobuf.Timestamp end_time = 2;
  optional SandboxNetworkEgressConfig egress = 3;
}

message SandboxDeleteRequest {
  string sandbox_id = 1;
  optional string kill_reason = 2;
}

message SandboxPauseRequest {
  string sandbox_id = 1;
  string template_id = 2;
  string build_id = 3;

  // When true, persist only the filesystem (no memory snapshot); resuming such
  // a snapshot cold-boots (reboots) from the rootfs. Default false = full memory
  // snapshot, so existing callers are unaffected.
  bool filesystem_only = 4;
}

message SchedulingMetadata {
  // memfile_base_build_id / rootfs_base_build_id are each artifact's root layer
  // (shared across the template's sandboxes); they can differ. build_id is the
  // final/current layer. All also appear in the lists below.
  string memfile_base_build_id = 1;
  string build_id = 2;
  // Deduplicated build IDs whose data each artifact references (all ancestor
  // layers plus the build itself). Sorted; order is not significant. When a
  // list exceeds the cap, the lightest layers are dropped first and the count
  // of dropped layers is reported.
  repeated string memfile_build_ids = 3;
  repeated string rootfs_build_ids = 4;
  uint32 memfile_dropped_builds = 5;
  uint32 rootfs_dropped_builds = 6;
  // Referenced bytes per build, aligned with the *_build_ids lists. On save the
  // new memfile layer's bytes are a pre-dedup, block-granular upper bound.
  repeated uint64 memfile_build_bytes = 7;
  repeated uint64 rootfs_build_bytes = 8;
  string rootfs_base_build_id = 9;
}

message SandboxPauseResponse {
  SchedulingMetadata scheduling_metadata = 1;

  // Fields 20+ belong to the workspace checkpoint track.
  // One sealed revision per bound workspace slot, in slot order.
  repeated SandboxWorkspaceRevision workspace_revisions = 20;

  // Guest memory recorded in the snapshot (boot memory plus the hotplug
  // memory plugged at pause), in MiB; a resume restores this size before it
  // applies its own requested_memory_mb. 0 from orchestrators that predate
  // memory hotplug or for a filesystem-only snapshot.
  int64 memory_mb = 21;

  // vCPU count granted to the sandbox when it was paused (CPU hotplug); a
  // resume restores it unless it asks for another. 0 from orchestrators that
  // predate CPU hotplug, for a fixed template or a filesystem-only snapshot.
  int64 vcpu_count = 22;
}

message SandboxCheckpointRequest {
  string sandbox_id = 1;
  string build_id = 3;
  // Provenance stamped onto the snapshot's storage objects for the storage
  // index (e.g. template_id). Opaque to the orchestrator, which just forwards
  // it to object metadata.
  map<string, string> metadata = 4;
}

message SandboxCheckpointResponse {
  SchedulingMetadata scheduling_metadata = 1;

  // Fields 20+ belong to the workspace checkpoint track.
  // One sealed revision per bound workspace slot, in slot order.
  repeated SandboxWorkspaceRevision workspace_revisions = 20;

  // As SandboxPauseResponse.memory_mb.
  int64 memory_mb = 21;

  // As SandboxPauseResponse.vcpu_count.
  int64 vcpu_count = 22;
}

message RunningSandbox {
  // Deprecated: the API no longer rebuilds sandbox state from this list. Redis
  // is the source of truth; List is only used to detect sandboxes running on a
  // node that the store does not know about, so they can be killed. The fields
  // below carry everything that decision needs. Still populated so API
  // instances predating those fields keep working during a rollout.
  SandboxConfig config = 1 [deprecated = true];
  string client_id = 2;

  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;

  // Minimal set required to detect an orphaned sandbox and kill it.
  // sandbox_id + team_id form the store key. execution_id is carried in the
  // edge sandbox-catalog delete event, so a cluster node's routing entry is
  // evicted too. vcpu/ram_mb feed the node's optimistic resource accounting.
  string sandbox_id = 5;
  string team_id = 6;
  string execution_id = 7;
  int64 vcpu = 8;
  int64 ram_mb = 9;
  // Guest memory the node accounts for this sandbox (requested or plugged,
  // whichever is larger), in MiB; equals ram_mb without hotplug.
  int64 memory_mb = 10;
  // vCPU count the node accounts for this sandbox (the granted count); 0
  // from nodes predating CPU hotplug, read as vcpu.
  int64 vcpu_count = 11;
}

message SandboxListResponse {
  repeated RunningSandbox sandboxes = 1;
}

service SandboxService {
  rpc Create(SandboxCreateRequest) returns (SandboxCreateResponse);
  rpc Update(SandboxUpdateRequest) returns (google.protobuf.Empty);
  rpc List(google.protobuf.Empty) returns (SandboxListResponse);
  rpc Delete(SandboxDeleteRequest) returns (google.protobuf.Empty);
  rpc Pause(SandboxPauseRequest) returns (SandboxPauseResponse);
  rpc Checkpoint(SandboxCheckpointRequest) returns (SandboxCheckpointResponse);
  rpc ResizeMemory(SandboxResizeMemoryRequest) returns (SandboxResizeMemoryResponse);
  rpc ResizeCpu(SandboxResizeCpuRequest) returns (SandboxResizeCpuResponse);
}
