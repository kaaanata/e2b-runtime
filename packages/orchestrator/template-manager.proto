syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "orchestrator.proto";

option go_package = "https://github.com/e2b-dev/infra/template-manager";


message InitLayerFileUploadRequest {
  string templateID = 1;
  string hash = 2;
  optional string cacheScope = 3;
}

message InitLayerFileUploadResponse{
  bool present = 1;
  optional string url = 2;
}

message TemplateStep {
  string type = 1;
  repeated string args = 2;
  optional bool force = 3;

  optional string filesHash = 4;
}

message FromTemplateConfig {
  string alias = 1;

  string buildID = 2;
}

// AWS ECR registry authentication
message AWSRegistry {
  string awsAccessKeyId = 1;
  string awsSecretAccessKey = 2;
  string awsRegion = 3;
}

// GCP registry authentication
message GCPRegistry {
  string serviceAccountJson = 1;
}

// General registry authentication with username/password
message GeneralRegistry {
  string username = 1;
  string password = 2;
}

// Docker registry authentication configuration
message FromImageRegistry {
  oneof type {
    AWSRegistry aws = 1;
    GCPRegistry gcp = 2;
    GeneralRegistry general = 3;
  }
}

message TemplateConfig {
  string templateID = 1;
  string buildID = 2;

  int32 memoryMB = 3;
  int32 vCpuCount = 4;
  int32 diskSizeMB = 5;

  // Deprecated: template-manager now selects the kernel and firecracker versions itself
  string kernelVersion = 6 [deprecated = true];
  string firecrackerVersion = 7 [deprecated = true];
  string startCommand = 8;
  // Deprecated: hugePages is derived from the resolved firecracker version locally
  bool hugePages = 9 [deprecated = true];

  string readyCommand = 10;

  optional bool force = 12;
  repeated TemplateStep steps = 13;

  oneof source {
     string fromImage = 11;
     FromTemplateConfig fromTemplate = 14;
   }

  optional FromImageRegistry fromImageRegistry = 15;

  string teamID = 16;

  // Optional during the rolling upgrade. When absent, the template manager
  // uses diskSizeMB as the post-build free-space target.
  optional int32 freeDiskSizeMB = 17;

  // layout is the guest device layout of the template: empty (rootfs only) or
  // "block-v1", whose base snapshot reserves workspace block slots so block
  // volumes can be attached to its sandboxes. A build from another template
  // inherits that template's layout when this is unset and must not change it.
  optional string layout = 18;
  // workspaceSlotCapacityBytes is the size of each workspace slot of a
  // "block-v1" build, one entry per slot; a block volume of exactly that size
  // takes the slot at runtime.
  repeated int64 workspaceSlotCapacityBytes = 19;
  // maxMemoryMB is the largest guest memory a sandbox of this template can be
  // resized to while it runs. When above memoryMB the template's base snapshot
  // carries a virtio-mem hotplug device of maxMemoryMB - memoryMB (a multiple
  // of 128 MiB); memoryMB stays the boot memory, the always-present minimum.
  // Unset or equal to memoryMB: no device, memory is fixed at memoryMB. A
  // build from another template inherits that template's device when unset
  // and must not change it.
  optional int32 maxMemoryMB = 20;
  // maxCpuCount is the largest vCPU count a sandbox of this template can be
  // resized to while it runs. When above vCpuCount the VM is created with
  // maxCpuCount vCPUs and the guest boots with only vCpuCount of them online
  // (maxcpus=); a resize brings CPUs online/offline in the guest and moves the
  // host cgroup CPU quota. At most 32 (Firecracker), even on x86 (SMT). Unset
  // or equal to vCpuCount: the vCPU count is fixed. A build from another
  // template inherits that template's maximum when unset and must not change it.
  optional int32 maxCpuCount = 21;
}

message TemplateCreateRequest {
  TemplateConfig template = 1;
  optional string cacheScope = 2;
  optional string version = 3;
}

enum LogLevel {
    Debug = 0;
    Info = 1;
    Warn = 2;
    Error = 3;
}

enum LogsDirection {
  Forward = 0;
  Backward = 1;
}

message TemplateStatusRequest {
  string templateID = 1;
  string buildID = 2;
  optional int32 offset = 3;
  optional LogLevel level = 4;
  optional uint32 limit = 5;

  optional google.protobuf.Timestamp start = 6;
  optional google.protobuf.Timestamp end = 7;
  optional LogsDirection direction = 8;
}

// Data required for deleting a template.
message TemplateBuildDeleteRequest {
  string buildID = 1;
  string templateID = 2;
}

message TemplateBuildMetadata {
  int32 rootfsSizeKey = 1;
  string envdVersionKey = 2;

  // Versions actually used by the template-manager to build the template.
  // The API persists these into the env_builds row once the build finishes.
  string kernelVersion = 3;
  string firecrackerVersion = 4;
  // Shared with the orchestrator so the API can match the build's scheduling
  // metadata against create/resume responses without a separate format.
  SchedulingMetadata schedulingMetadata = 5;
  // Device layout the template was built with, after inheritance from a base
  // template: empty (rootfs only) or "block-v1". Always set by
  // template-managers that know layouts; unset means the template-manager
  // predates them and the layout is unknown. The API persists it so it can
  // report and pre-check a template's layout without reading its metadata.
  optional string layout = 6;
  // Capacity of each workspace slot of a "block-v1" template, in bytes.
  repeated int64 workspaceSlotCapacityBytes = 7;
  // Maximum guest memory of a template built with a virtio-mem hotplug
  // device (after inheritance), in MiB. Unset when the build has no device;
  // with layout set (a template-manager that knows layouts) an unset value
  // therefore means "no device", without layout it means unknown.
  optional int32 maxMemoryMB = 8;
  // Maximum vCPU count of a template built with CPU hotplug (after
  // inheritance). Unset when the build has a fixed vCPU count; like
  // maxMemoryMB only meaningful together with layout.
  optional int32 maxCpuCount = 9;
}

enum TemplateBuildState {
  Building = 0;
  Failed = 1;
  Completed = 2;
}

message TemplateBuildLogEntry {
  google.protobuf.Timestamp timestamp = 1;
  string message = 2;
  LogLevel level = 3;
  map<string, string> fields = 4;
}

message TemplateBuildStatusReason {
  string message = 1;
  optional string step = 2;
}

// Logs from template build
message TemplateBuildStatusResponse {
  reserved 3, 4;

  TemplateBuildState status = 1;
  TemplateBuildMetadata metadata = 2;
  repeated TemplateBuildLogEntry logEntries = 5;

  optional TemplateBuildStatusReason reason = 6;
}

// Interface exported by the server.
service TemplateService {
  // TemplateCreate is a gRPC service that creates a new template
  rpc TemplateCreate (TemplateCreateRequest) returns (google.protobuf.Empty);

  // TemplateStatus is a gRPC service that streams the status of a template build
  rpc TemplateBuildStatus (TemplateStatusRequest) returns (TemplateBuildStatusResponse);

  // TemplateBuildDelete is a gRPC service that deletes files associated with a template build
  rpc TemplateBuildDelete (TemplateBuildDeleteRequest) returns (google.protobuf.Empty);

  // InitLayerFileUpload requests an upload URL for a tar file containing layer files to be cached for the template build.
  rpc InitLayerFileUpload (InitLayerFileUploadRequest) returns (InitLayerFileUploadResponse);
}
